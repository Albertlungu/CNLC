<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Discovereye</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/calendar.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/mobile-nav.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/agent-widget.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6600">
    <script src="js/theme.js"></script>
    <script src="js/mobile.js"></script>
    <link rel="stylesheet" href="css/tts.css">
    <link rel="stylesheet" href="css/voice-control.css">
</head>
<body>
    <nav class="menu-bar"></nav>

    <div class="main-content">
        <div class="calendar-container">
            <div class="calendar-header">
                <h1>Calendar</h1>
                <div class="calendar-actions">
                    <button id="connect-google-btn" class="connect-google-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        Connect Google Calendar
                    </button>
                    <button id="add-event-btn" class="add-event-btn" style="display:none;">Add Event</button>
                </div>
            </div>

            <div id="google-status" class="google-status" style="display:none;">
                <span id="google-email"></span>
                <button id="disconnect-google" class="disconnect-btn">Disconnect</button>
            </div>

            <div class="calendar-nav">
                <button id="prev-month" class="nav-btn">&lt;</button>
                <h2 id="current-month-label"></h2>
                <button id="next-month" class="nav-btn">&gt;</button>
            </div>

            <div class="calendar-grid">
                <div class="calendar-day-header">Sun</div>
                <div class="calendar-day-header">Mon</div>
                <div class="calendar-day-header">Tue</div>
                <div class="calendar-day-header">Wed</div>
                <div class="calendar-day-header">Thu</div>
                <div class="calendar-day-header">Fri</div>
                <div class="calendar-day-header">Sat</div>
                <div id="calendar-days" class="calendar-days"></div>
            </div>

            <div class="events-panel">
                <h3 id="events-date-label">Today's Events</h3>
                <div id="events-list" class="events-list">
                    <p class="events-empty">Select a day to see events</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Event Modal -->
    <div id="add-event-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Event to Google Calendar</h2>
                <span class="modal-close" id="event-modal-close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="event-title">Title</label>
                    <input type="text" id="event-title" placeholder="Event title...">
                </div>
                <div class="form-group">
                    <label for="event-date">Date</label>
                    <input type="date" id="event-date">
                </div>
                <div class="form-group form-row">
                    <div>
                        <label for="event-start-time">Start Time</label>
                        <input type="time" id="event-start-time" value="12:00">
                    </div>
                    <div>
                        <label for="event-end-time">End Time</label>
                        <input type="time" id="event-end-time" value="13:00">
                    </div>
                </div>
                <div class="form-group">
                    <label for="event-description">Description (optional)</label>
                    <textarea id="event-description" rows="3" placeholder="Event details..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-cancel" id="event-cancel">Cancel</button>
                <button class="modal-btn modal-btn-confirm" id="event-submit">Add Event</button>
            </div>
        </div>
    </div>

    <script src="js/pwa.js"></script>
    <script type="module" src="js/calendar.js"></script>
    <script type="module" src="js/agent-widget.js"></script>
    <script type="module" src="js/tts.js"></script>
    <script type="module" src="js/voice-control.js"></script>
</body>
</html>
